<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <filter id="shadow-spiga" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="70" cy="70" r="58" fill="#ebebeb" filter="url(#shadow-spiga)"/>

  <!-- Wheat Ear (Spiga) - Authentic Vorwerk seamless geometry -->
  <g fill="#113c2b">
    <!-- 1. Tip grain -->
    <path d="M 71 31.5 
             C 69 34.5, 69.5 37.5, 73.5 39.5 
             C 74.5 36.5, 73.5 33.5, 71 31.5 Z"/>

    <!-- 2. Top-Right grain -->
    <path d="M 80.5 38 
             C 76.5 39.7, 74.4 42.3, 73.5 46.5 
             C 78.7 45.7, 81 43, 80.5 38 Z"/>

    <!-- 3. Top-Left grain -->
    <path d="M 67 40 
             C 65.5 45.4, 67 48.9, 72 51.5 
             C 72.5 46.5, 71 43, 67 40 Z"/>

    <!-- 4. Mid-Right grain -->
    <path d="M 80.5 49.5 
             C 75.2 51, 73.1 54, 73.5 59.5 
             C 78.8 58, 81 55, 80.5 49.5 Z"/>

    <!-- 5. Mid-Left grain -->
    <path d="M 64 52.5 
             C 62.7 58.7, 64.3 62.9, 69.5 66.5 
             C 71 60.5, 69.5 56.5, 64 52.5 Z"/>

    <!-- 6. Bottom-Right grain (merges seamlessly into stem) -->
    <path d="M 79.5 62.5 
             C 74 65, 72 68, 71.5 75 
             C 77.5 72.5, 80 68.5, 79.5 62.5 Z"/>

    <!-- 7. Stem and Leaf (seamless continuation under grains, no gap or cut-off) -->
    <path d="M 52 69.5 
             C 57 74, 63 79, 66.5 83 
             C 67.5 81, 68 77, 68.5 72 
             C 69.5 70.5, 72 70.5, 73 72 
             C 72.5 79, 71.5 87, 70.5 96 
             C 70.2 99.5, 69.5 101.5, 67.5 101.5 
             C 65.5 101.5, 65 99.5, 65 96 
             C 65 93, 65.5 91, 66 89.5 
             C 62 87, 57 81, 52 69.5 Z"/>
  </g>
</svg>
