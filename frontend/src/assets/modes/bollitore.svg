<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <filter id="shadow-bollitore" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="70" cy="70" r="58" fill="#ebebeb" filter="url(#shadow-bollitore)"/>

  <!-- Steam lines -->
  <g fill="none" stroke="#113c2b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 52 50 C 50 46, 54 42, 52 38"/>
    <path d="M 58 50 C 56 46, 60 42, 58 38"/>
  </g>

  <!-- Kettle Lid -->
  <path d="M 64 54 C 67 50, 81 50, 84 54 Z" fill="#113c2b"/>

  <!-- Kettle Body with Spout -->
  <path d="M 56 55
           L 88 55
           L 92 88
           L 56 88
           L 56 57
           L 52 55
           Z" fill="#113c2b"/>

  <!-- Kettle Base Bar -->
  <rect x="56" y="90.5" width="36" height="3.5" rx="1" fill="#113c2b"/>

  <!-- Kettle Handle -->
  <path d="M 88 56 
           L 97 58 
           C 99 59, 100 61, 100 63 
           L 97 76 
           C 96 79, 94 81, 91 82 
           L 89 82" 
        fill="none" 
        stroke="#113c2b" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
