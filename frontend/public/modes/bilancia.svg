<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <filter id="shadow-bilancia" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="70" cy="70" r="58" fill="#ebebeb" filter="url(#shadow-bilancia)"/>

  <!-- Bilancia Icon -->
  <g stroke="#113c2b" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical Pillar -->
    <line x1="71" y1="46" x2="71" y2="90" stroke-width="6.5"/>

    <!-- Tilted Crossbeam -->
    <line x1="47" y1="58" x2="94" y2="43" stroke-width="6.5"/>

    <!-- Left Pan Suspension Wires -->
    <polyline points="49,60 38,82 61,82 49,60" stroke-width="2.8"/>

    <!-- Right Pan Suspension Wires -->
    <polyline points="92,45 81,68 104,68 92,45" stroke-width="2.8"/>
  </g>

  <!-- Pans (Filled bottom curves) -->
  <path d="M 37 82 C 37 87.5, 62 87.5, 62 82 Z" fill="#113c2b"/>
  <path d="M 80 68 C 80 73.5, 105 73.5, 105 68 Z" fill="#113c2b"/>
</svg>
