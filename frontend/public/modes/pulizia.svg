<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <filter id="shadow-pulizia" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="70" cy="70" r="58" fill="#ebebeb" filter="url(#shadow-pulizia)"/>

  <!-- Mixing Bowl (Boccale) -->
  <g fill="none" stroke="#113c2b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Rim with Lip -->
    <path d="M 45 47 L 94 47" stroke-width="3.5"/>

    <!-- Bowl Wall Outline -->
    <path d="M 47 47 L 54 86 L 86 86 L 93 47" stroke-width="3.2"/>

    <!-- Handle on Right -->
    <path d="M 94 48 
             L 106 59 
             L 98 77 
             L 86 85" 
          stroke-width="4.8"/>
  </g>

  <!-- Base of the Bowl (Solid filled bottom block) -->
  <path d="M 53 86 L 87 86 L 84 94 L 56 94 Z" fill="#113c2b"/>

  <!-- Water Droplet in Center -->
  <path d="M 70 57 
           C 70 57, 62.5 67, 62.5 72 
           C 62.5 76.5, 65.8 80, 70 80 
           C 74.2 80, 77.5 76.5, 77.5 72 
           C 77.5 67, 70 57, 70 57 Z" 
        fill="#113c2b"/>
</svg>
