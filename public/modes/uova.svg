      <feDropShadow dx="-1" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="70" cy="70" r="58" fill="#ebebeb" filter="url(#egg-shadow)"/>
  
