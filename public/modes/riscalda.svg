<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <filter id="reheat-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="70" cy="70" r="58" fill="#ebebeb" filter="url(#reheat-shadow)"/>
  
  <g fill="#113c2b">
    <!-- Food mound (domed warm food) -->
    <path d="M 48 76 
             C 48 71, 54 67, 60 68
             C 63 65, 68 64, 72 64
             C 77 64, 82 66, 84 69
             C 88 69, 92 72, 92 76
             Z"/>

    <!-- Bowl -->
    <path d="M 46 76
             L 94 76
             C 93 85, 85 95, 76 96
             L 64 96
             C 55 95, 47 85, 46 76
             Z"/>
  </g>

  <!-- 3 Rising Steam Waves -->
  <g fill="none" stroke="#113c2b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Steam -->
    <path d="M 59 60 C 56 55, 62 51, 59 46"/>
    <!-- Center Steam (Taller) -->
    <path d="M 70 59 C 67 53, 73 48, 70 42"/>
    <!-- Right Steam -->
    <path d="M 81 60 C 78 55, 84 51, 81 46"/>
  </g>
</svg>
